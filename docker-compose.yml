services:
  rv-files:
    container_name: rv-files
    # RV Files has no published image yet, so build from this repository.
    # (The upstream smp46/pingvin-share-x image does not contain the RV Files hardening.)
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - 3000:3000
    environment:
      - TRUST_PROXY=false # Set to true if a reverse proxy is in front of the container
    volumes:
      - "./data:/opt/app/backend/data:rw,z"
      - "./data/images:/opt/app/frontend/public/img:rw,z"
  #      - "./config.yaml:/opt/app/config.yaml" # Add this line to configure the app with a config file instead of the admin UI

  # To add ClamAV, to scan your shares for malicious files,
  # see https://smp46.github.io/pingvin-share-x/setup/integrations/#clamav-docker-only
